      name="description"
      content="CloudTech Analytics builds business software, data solutions, AI applications and technology services designed around real operational workflows."
    />
    <meta name="theme-color" content="#F8F5EF" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint (matches src/lib/theme.ts).
      try {
        var t = localStorage.getItem("ct-theme");
        var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#14161B");
        }
      } catch (e) {}
    </script>
